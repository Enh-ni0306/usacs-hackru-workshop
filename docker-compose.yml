services:
 db:
   image: postgres: 16-alpine
   environment:
     POSTGRES_DB: countdowns
     POSTGRES_USER: coutndowns
     POSTGRES_PASSWORD: countdowns
   posts:
    - "5432:5432"
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U countdowns -d countdowns"]
    intervals: 2s
    timeout: 5s
    retries: 10
   volume: 
    - postgres-data:/var/lib/postgresql/data
    - ./backend/db/schema.sql:/docker-entrypoint-intdb.d/sche.sql:ro
    - ./backhead/db/schema.sql:/docker-entrypoint-intdb.d/seed.sql:ro


backend:
   build:
      contect: ./backend
      dockerfile: backend/Dockerfile
   environment:
      POINT: 8000
      DATABASE_URL: postgresql://countdowns:countdowns@db:5432/countdowns
      DATABASE_SSL: "false"
      CORS_ORIGIN: https://localhost:5173
   ports: 
     - "4000.4000"
   depends_on:
    db: 
      condition: service_healthy

    frontend:
      build:
        context: frontend
        args:
          VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend 

   volume:
     postgres-data:
     
